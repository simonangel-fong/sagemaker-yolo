name: build images

on:
  push:
    branches: [master]
    paths:
      - train/Dockerfile
      - lambda/**
      - .github/workflows/build-images.yml
  workflow_dispatch:
    inputs:
      image:
        description: Which image to build
        type: choice
        options: [both, train, predict]
        default: both

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  PROJECT: sagemaker-yolo
  DLC_REGISTRY: 763104351884.dkr.ecr.ca-central-1.amazonaws.com

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  # ##############################
  # Decide which images to build
  # ##############################
  # Path filters cannot express "changed OR manually selected", so the choice
  # is resolved once here and read by both build jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      train: ${{ steps.decide.outputs.train }}
      predict: ${{ steps.decide.outputs.predict }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Decide targets
        id: decide
        env:
          CHOICE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$CHOICE" in
              both)    emit train true;  emit predict true ;;
              train)   emit train true;  emit predict false ;;
              predict) emit train false; emit predict true ;;
            esac
            exit 0
          fi

          # github.event.before is all zeros for a branch's first push, and may
          # point at a commit that no longer exists after a force push.
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="${{ github.sha }}~1"
          fi

          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "changed files:"; echo "$changed"

          if grep -q '^train/Dockerfile' <<<"$changed"; then emit train true; else emit train false; fi
          if grep -q '^lambda/'          <<<"$changed"; then emit predict true; else emit predict false; fi

  # ##############################
  # Training image -> SageMaker
  # ##############################
  train:
    needs: changes
    if: needs.changes.outputs.train == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The PyTorch DLC base is several GB; the default runner image leaves
      # too little free space to unpack it alongside the build cache.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look up account id
        id: acct
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      # Two registries: ours to push to, AWS's to pull the DLC base from.
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
        with:
          registries: ${{ steps.acct.outputs.id }},763104351884

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: train
          push: true
          platforms: linux/amd64
          # Buildx would otherwise publish an OCI image index; SageMaker and
          # Lambda both want a plain manifest.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.acct.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}-train:${{ github.sha }}
            ${{ steps.acct.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}-train:latest
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: Summary
        run: |
          echo "### Training image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.acct.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}-train:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Pass this to the pipeline as --train-image." >> "$GITHUB_STEP_SUMMARY"

  # ##############################
  # Predict image -> Lambda
  # ##############################
  predict:
    needs: changes
    if: needs.changes.outputs.predict == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-predict:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-predict:latest
          cache-from: type=gha,scope=predict
          cache-to: type=gha,scope=predict,mode=max

      # Terraform resolves the image digest at plan time, so a new push alone
      # does not move the running function. Update it directly and let the next
      # apply converge on the same digest.
      - name: Update Lambda
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-predict:${{ github.sha }}
          FUNCTION: ${{ env.PROJECT }}-dev-predict
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            echo "::warning::$FUNCTION does not exist yet; skipping update."
            exit 0
          fi

          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$IMAGE" \
            --publish >/dev/null

          aws lambda wait function-updated --function-name "$FUNCTION"
          echo "$FUNCTION now runs $IMAGE"
