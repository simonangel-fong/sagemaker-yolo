# Builds the Lambda inference image.
name: build lambda image

on:
  push:
    branches: [master]
    paths:
      - lambda/**
      - .github/workflows/build-lambda-image.yml
  workflow_dispatch:

concurrency:
  group: build-lambda-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  PROJECT: sagemaker-yolo
  ENV: dev

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login AWS
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-predict:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-predict:latest
          cache-from: type=gha,scope=predict
          cache-to: type=gha,scope=predict,mode=max
