# Builds the Lambda image.
name: build lambda image

on:
  push:
    branches: [master]
    paths:
      - lambda/**
      - .github/workflows/build-lambda-image.yml
  workflow_dispatch:

concurrency:
  group: build-lambda-image-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: sagemaker-yolo
  ENV: dev
  AWS_REGION: ca-central-1

permissions:
  contents: read
  id-token: write # required to request the OIDC token

jobs:
  build-lambda-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credential
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login AWS
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Setup buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: lambda
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-lambda:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-lambda:latest
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,scope=lambda,mode=max

