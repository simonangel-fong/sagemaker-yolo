# Plans terraform on every change, and applies only on manual dispatch.
name: deploy infra

on:
  push:
    branches: [master]
    paths:
      - infra/**
      - .github/workflows/deploy-infra.yml
  pull_request:
    paths:
      - infra/**
      - .github/workflows/deploy-infra.yml
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: deploy-infra
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"
  PROJECT: "sagemaker-yolo"

permissions:
  contents: read
  id-token: write # required to request the OIDC token
  pull-requests: write # to post the plan on the PR

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_env: ${{ vars.ENV }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      # Required by infra/project-cicd_terraform.tf; same bucket as the backend.
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_repo_owner_id: ${{ vars.REPO_OWNER_ID }}
      TF_VAR_repo_id: ${{ vars.REPO_ID }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_public_subnet_id: ${{ vars.PUBLIC_SUBNET_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper rewrites stdout and breaks capturing plan output below.
          terraform_wrapper: false

      - name: Configure AWS credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GH_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          set -euo pipefail

          terraform -chdir=infra init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.PROJECT }}/${{ env.TF_VAR_env }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail

          terraform -chdir=infra plan \
            -input=false \
            -out=tfplan \
            -detailed-exitcode && code=$? || code=$?

          # -detailed-exitcode: 0 = no changes, 2 = changes pending, 1 = error.
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

          terraform -chdir=infra show -no-color tfplan > plan.txt

      - name: Summarize plan
        run: |
          {
            echo "### Terraform plan"
            echo "Changes pending: \`${{ steps.plan.outputs.changes }}\`"
            echo
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```terraform'
            # Step summaries cap at 1 MiB; a large plan would be dropped whole.
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const body = [
              '### Terraform plan',
              '`changes pending: ${{ steps.plan.outputs.changes }}`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... truncated' : plan,
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Applies the plan file produced above, so what runs is exactly what was
      # shown -- no re-plan that could pick up drift in between.
      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Summarize outputs
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: |
          {
            echo "### Outputs"
            echo '```'
            terraform -chdir=infra output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
